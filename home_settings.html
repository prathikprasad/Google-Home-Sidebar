<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Google Home Sidebar Settings</title>
    <style>
      body { font-family: Arial, sans-serif; padding: 30px; max-width: 450px; margin: 40px auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border-radius: 8px; border: 1px solid #eee; background-color: #ffffff; }
      h2 { color: #1a73e8; margin-top: 0; }
      label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 14px; color: #333; }
      input[type="url"] { width: 100%; padding: 10px; box-sizing: border-box; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
      input[type="url"]:focus { border-color: #1a73e8; outline: none; }
      button { background-color: #1a73e8; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: bold; width: 100%; }
      button:hover { background-color: #1557b0; }

      .status-alert {
        display: none;
        background-color: #e6f4ea;
        color: #137333;
        padding: 12px;
        border-radius: 4px;
        margin-top: 20px;
        font-size: 14px;
        font-weight: 500;
        text-align: center;
        border: 1px solid #ceead6;
      }
    </style>
  </head>
  <body>
    <h2>Home Settings</h2>
    <p style="color: #666; font-size: 13px; line-height: 1.4;">
      Open <a href="https://home.google.com" target="_blank">home.google.com</a>, go to your Devices page,
      and paste the full URL from your browser's address bar below.
    </p>

    <label for="homeUrl">Google Home Devices URL:</label>
    <input type="url" id="homeUrl" placeholder="https://home.google.com/u/1/home/.../devices">

    <button id="save">Save Settings</button>

    <div id="status" class="status-alert"></div>

    <script src="home_settings.js"></script>
  </body>
</html>
